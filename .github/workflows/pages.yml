name: Rebuild site

# Edit anything in _data/, templates/, assets/ or files/ and commit:
# this workflow regenerates the HTML pages at the repo root and commits them,
# and GitHub Pages (Deploy from a branch: main, / root) publishes them.
on:
  push:
    branches: [main]
    paths:
      - "_data/**"
      - "templates/**"
      - "assets/**"
      - "files/**"
      - "build.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jinja2 pyyaml
      - run: python build.py
      - name: Copy pages to the repo root
        run: cp _site/*.html .
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- *.html
          if git diff --cached --quiet; then
            echo "Pages already up to date."
          else
            git commit -m "Rebuild pages"
            git push
          fi
      - name: Ask GitHub Pages to publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
