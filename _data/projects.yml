- id: asr
  title: Alkali–silica reaction
  scale: "Å → mm"
  summary: Atomic structures, thermodynamics and expansion mechanisms of ASR products, from crystalline phases to mortar.
  image: assets/img/projects/asr.jpg
  figure_hint: SEM images of synthesized ASR products, Na-shlykovite and ASR-P1
  caption: >-
    SEM images of synthesized ASR products: Na-shlykovite (Na₂O–SiO₂–CaO–H₂O system, left) and
    ASR-P1 (Na₂O–K₂O–SiO₂–CaO–H₂O system, right). Bottom: magnified views of the boxed areas.
  body: >-
    The alkali–silica reaction forms layered silicate products whose growth in confined pores
    damages concrete. We build atomic models of crystalline ASR products (shlykovite, kanemite,
    magadiite and related phases), derive their thermodynamic and thermoelastic data, and use them
    in phase diagrams and micromechanical estimates of crystallization pressure. Synthesis and
    NMR characterization of the products close the loop with experiments.
  people: [Elvys Dias Reis, Syrine Razki, Thibault Charpentier, Alexandra Bourdot, Farid Benboudjema]
  funding: [ANR/CEA – Mastering the expansion in ASR (PI), ANR HEAT COFFEE]
  papers: [J64, J62, J56, J50, J49, J24]

- id: csh-cg
  title: Coarse-grained C-S-H gel
  scale: "nm → µm"
  summary: Mesostructure and mechanics of C-S-H and ASR gels from coarse-grained simulations with flexible multi-site particles.
  image: assets/img/projects/csh-cg.jpg
  figure_hint: Coarse-grained model of the C-S-H gel with multi-site flexible particles
  caption: >-
    Coarse-grained model of the C-S-H gel built from multi-site flexible particles (packing density 50%),
    with a magnified view of the particle arrangement.
  body: >-
    The C-S-H gel is an assembly of nanometric, flexible particles whose arrangement controls the
    mechanics, creep and transport of cement paste. We represent these particles as flexible
    multi-site objects and simulate the resulting gel mesostructure with coarse-grained simulations,
    to link particle shape, flexibility and packing to the properties of the gel. The same approach
    applies to the gels formed by the alkali–silica reaction.
  people: [Sofiane Ait-Hamadouche]
  funding: []
  papers: [J47]
  in_prep:
    - "Honorio, T. Mesostructure and properties of C–S–H gel from coarse-grained simulations with multi-site flexible particles."

- id: csh-molecular
  title: C-S-H at the molecular scale
  scale: "Å → nm"
  summary: Atomic models of C-S-H and the behaviour of the water confined in its nanopores.
  image: assets/img/projects/csh-molecular.jpg
  figure_hint: Molecular models of C-S-H pores from interlayer to gel pore sizes, C-S-H mesostructure and nanoscale cavitation
  caption: >-
    (A) Molecular models of C-S-H pores with sizes from 11.6 to 36 Å, covering interlayer and gel pores.
    (B) C-S-H mesostructure with interlayer (micro)pores and gel (meso)pores. (C) Heterogeneous and
    homogeneous cavitation at the nanoscale. From Masara, Benboudjema & Honorio, Langmuir (2024),
    ANR THEDESCO project.
  body: >-
    C-S-H is the main binding phase of concrete. We build and benchmark atomic models of C-S-H and use
    molecular simulations to compute its thermal, mechanical and transport properties, and to study the
    structure and dynamics of the water confined in its nanopores, including the subdiffusive water
    dynamics from which power-law creep emerges.
  people: [Fatima Masara, Farid Benboudjema, Naohiko Saeki]
  funding: [ANR THEDESCO]
  papers: [J53, J66, J57, J48, J35, J16]

- id: sorption
  title: Sorption and sorption-induced deformation
  scale: "Å → mm"
  summary: Water sorption, hysteresis and disjoining pressure in nanopores, and the shrinkage and swelling they cause.
  image: assets/img/projects/sorption.jpg
  figure_hint: Water content of ettringite and metaettringite versus relative humidity from GCMC-MD simulations, showing sorption hysteresis
  caption: >-
    Sorption hysteresis in ettringite from hybrid GCMC-MD simulations: water content (n+6) versus relative
    humidity on desorption (ettringite) and adsorption (metaettringite), with the corresponding atomic
    structures. From Honorio, Maaroufi, Al Dandachli & Bourdot, Cement and Concrete Research (2021).
  body: >-
    Drying and wetting change the forces between the nanolayers of C-S-H, clays and other hydrates,
    causing shrinkage, swelling and hysteresis. We simulate sorption isotherms, disjoining pressures and
    cavitation in nanopores under varying humidity and temperature, and build poromechanical models that
    carry these effects up to the drying shrinkage and thermal deformation of concrete.
  people: [Fatima Masara, Farid Benboudjema, Laurent Brochard, Matthieu Vandamme, Elvys Dias Reis]
  funding: [ANR THEDESCO]
  papers: [J32, J53, J42, J44, J51, J20]

- id: pce
  title: Superplasticizers (PCE)
  scale: "Å → nm"
  summary: Atomistic and coarse-grained models of polycarboxylate ether superplasticizers and their adsorption on cement phases.
  image: assets/img/projects/pce-card.jpg
  figure_hint: All-atom PCE 40:10–25 molecule built with pyPCE
  caption: >-
    All-atom PCE 40:10–25 molecule (n/p = 4, f_g = 20%) built with pyPCE (OPLS-AA).
    C grey, O red, H white.
  body: >-
    Polycarboxylate ether (PCE) superplasticizers control the workability of modern concretes,
    including low-clinker mixes. We generate realistic all-atom PCE architectures and study their
    conformation and adsorption on cement and clay surfaces, as input to coarse-grained models of
    particle interactions and rheology. To build these molecules, we developed pyPCE, a Python tool
    that generates all-atom PCE models for LAMMPS (OPLS-AA) directly from their synthesis parameters:
    backbone length, grafting density, side-chain length, linkage chemistry and protonation state.
    An article presenting pyPCE is in preparation.
  people: [Ana Paula Kirchheim (UFRGS, Brazil)]
  funding: []
  papers: []

- id: irradiation
  title: Irradiation of aggregates
  scale: "Å → m"
  summary: Radiation-induced volumetric expansion (RIVE) of aggregate minerals and hydrogen transport in irradiated hydrates.
  image: ""
  figure_hint: Amorphized quartz cell or RIVE vs. dose curve
  body: >-
    Concrete near nuclear reactors is exposed to neutron and gamma radiation. Using molecular dynamics,
    we quantify radiation-induced volumetric expansion in the minerals of concrete aggregates (quartz,
    feldspars, micas, inosilicates) and study H₂ transport in irradiated hydrates. These results feed
    mesoscale simulations and simplified models of irradiated concrete.
  people: [Hazem Ferchichi, Abderrahmane Lahmar, Stéphane Poyet, Benoît Bary, Paul Fossati, Sophie Le Caër]
  funding: [CEA]
  papers: [J52, J69]

- id: clay-diffusion
  title: Water and ions in clays
  scale: "Å → nm"
  summary: Anomalous diffusion, swelling and thermo-poromechanics of water and counterions confined in swelling clays.
  image: assets/img/projects/clay-diffusion.jpg
  figure_hint: Na-montmorillonite at 1W, 1.5W, 2W and 3W hydration states
  caption: >-
    Molecular models of Na-montmorillonite at increasing hydration: one-, one-and-a-half-, two- and
    three-layer hydrates (1W, 1.5W, 2W, 3W). Clay layers in yellow and red, Na⁺ counterions in purple,
    interlayer water in red and white.
  body: >-
    Swelling clays confine water and ions in nanometric interlayers. We show that their transport is
    subdiffusive and describe it with fractional diffusion laws, and we study how counterions control
    disjoining and swelling pressure. The same framework explains anomalous thermal pressurization and
    heat capacity in clays.
  people: [Laurent Brochard, Matthieu Vandamme]
  funding: []
  papers: [J67, J37, J27, J13, J8, J7]

- id: electrical
  title: Electrical and dielectric properties
  scale: "Å → m"
  summary: Dielectric permittivity and ionic conductivity of pore solutions and hydrates, upscaled for non-destructive testing.
  image: assets/img/projects/electrical.jpg
  figure_hint: Impedance of the C-S-H gel versus frequency for increasing packing density, with equivalent circuits
  caption: >-
    Impedance of C-S-H from the molecular scale, upscaled with micromechanics: real part of the gel
    impedance versus frequency for increasing packing density η. Below the threshold η_c ≈ 0.667 the
    response is dominated by mesopores (conductor), above it by micropores (insulator). Right:
    equivalent circuits with (a) capacitors and (b) constant-phase elements. From Honorio, Bonfim &
    Cascudo, Cement and Concrete Research (2026).
  body: >-
    Electrical and dielectric measurements are non-destructive ways to follow hydration, moisture and
    degradation in concrete. We compute the dielectric permittivity and ionic conductivity of pore solutions
    and hydrates from molecular simulations, and upscale them with micromechanics to interpret impedance and
    microwave measurements on cement pastes and concrete.
  people: [Sofiane Ait-Hamadouche, Walter Batista Bonfim, Oswaldo Cascudo, Helena Carasek, Éric Vourc'h, Thierry Bore]
  funding: [IDEX LaSIPS (HYDRA)]
  papers: [J60, J45, J43, J19, J18, J17]

- id: low-carbon
  title: Low-carbon concrete
  scale: "nm → m"
  summary: Composition–property links for blended low-clinker cements, from thermodynamic modelling and micromechanics to experiments.
  image: assets/img/projects/low-carbon.jpg
  figure_hint: Phase assemblage of a CEM V/A S-Q blended cement paste versus age from thermodynamic modelling
  caption: >-
    Phase assemblage of a CEM V/A (S-Q) cement paste (slag and calcined clay) as a function of age, from
    thermodynamic modelling with CemGEMS (stacked volume fractions, w/c = 0.4). Dashed lines mark the ages
    of mechanical testing. From Honorio, TINCE 2026.
  body: >-
    Blended cements with limestone, slag and calcined clays are replacing clinker, but the number of
    possible binder combinations is too large to test experimentally. We compute the phase assemblages of
    commercial blended cements over time with thermodynamic modelling, and use them as input to
    micromechanical homogenization to predict Young's modulus and compressive strength without
    characterizing each binder in detail. An ongoing experimental campaign on cements from the French
    market measures their mechanical properties to validate and extend this binder-agnostic approach.
    Related work covers new hydrates such as M-(A)-S-H and the electrical response of C-S-H for
    non-destructive monitoring.
  people: [Nathan Martins, Fatima Masara, Walter Batista Bonfim, Oswaldo Cascudo, Thibault Charpentier]
  funding: [CEA–EDF–Framatome tripartite agreement]
  papers: [J60, J61, J41]
  conference:
    - "Honorio, T. Blended low carbon binders: composition–property correlations for elastic constants and compressive strength. TINCE 2026 (submitted)."
