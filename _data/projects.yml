# image: path to a figure in assets/img/projects/ (leave empty to show a placeholder)
# papers: ids from publications.yml
- id: asr
  title: Alkali–silica reaction
  scale: "Å → mm"
  summary: Atomic structures, thermodynamics and expansion mechanisms of ASR products, from crystalline phases to mortar.
  image: ""
  figure_hint: Crystalline ASR product structure or phase diagram
  body: >-
    The alkali–silica reaction forms layered silicate products whose growth in confined pores
    damages concrete. We build atomic models of crystalline ASR products (shlykovite, kanemite,
    magadiite and related phases), derive their thermodynamic and thermoelastic data, and use them
    in phase diagrams and micromechanical estimates of crystallization pressure. Synthesis and
    NMR characterization of the products close the loop with experiments.
  people: [Elvys Dias Reis, Syrine Razki, Thibault Charpentier, Alexandra Bourdot, Farid Benboudjema]
  funding: [ANR/CEA – Mastering the expansion in ASR (PI), ANR HEAT COFFEE]
  papers: [J64, J62, J56, J50, J49, J24]

- id: csh-cg
  title: Coarse-grained C-S-H
  scale: "nm → µm"
  summary: Mesostructure, creep and transport of the C-S-H gel from coarse-grained and molecular simulations.
  image: ""
  figure_hint: Snapshot of the coarse-grained C-S-H mesostructure
  body: >-
    C-S-H is the main binding phase of concrete and controls its creep, shrinkage and transport.
    We represent C-S-H particles as flexible multi-site objects to simulate the gel mesostructure,
    and link the dynamics of confined water to macroscopic behaviour, such as the power-law creep
    that emerges from subdiffusive water dynamics.
  people: [Fatima Masara, Farid Benboudjema]
  funding: []
  papers: [J66, J57, J48, J47, J13]

- id: sorption
  title: Sorption and sorption-induced deformation
  scale: "Å → mm"
  summary: Water sorption, hysteresis and disjoining pressure in nanopores, and the shrinkage and swelling they cause.
  image: ""
  figure_hint: Sorption isotherm with hysteresis, or water in a C-S-H nanopore
  body: >-
    Drying and wetting change the forces between the nanolayers of C-S-H, clays and other hydrates,
    causing shrinkage, swelling and hysteresis. We simulate sorption isotherms, disjoining pressures and
    cavitation in nanopores under varying humidity and temperature, and build poromechanical models that
    carry these effects up to the drying shrinkage and thermal deformation of concrete.
  people: [Fatima Masara, Farid Benboudjema, Laurent Brochard, Matthieu Vandamme, Elvys Dias Reis]
  funding: [ANR THEDESCO]
  papers: [J53, J42, J44, J51, J32, J20]

- id: pce
  title: Superplasticizers (PCE)
  scale: "Å → nm"
  summary: Atomistic and coarse-grained models of polycarboxylate ether superplasticizers and their adsorption on cement phases.
  image: assets/img/projects/pce.jpg
  figure_hint: All-atom PCE 40:10–25 molecule in extended and random-coil starting conformations
  caption: >-
    All-atom PCE 40:10–25 (50 backbone units, 10 PEG side chains of 25 EO units) built with pyPCE (OPLS-AA):
    (a) extended all-trans and (b) random-coil melt starting structures, before equilibration.
    C grey, O red, H white. Article in preparation.
  body: >-
    Polycarboxylate ether (PCE) superplasticizers control the workability of modern concretes,
    including low-clinker mixes. We generate realistic all-atom PCE architectures and study their
    conformation and adsorption on cement and clay surfaces, as input to coarse-grained models of
    particle interactions and rheology.
  people: [Ana Paula Kirchheim]
  funding: []
  papers: []

- id: irradiation
  title: Irradiation of aggregates
  scale: "Å → m"
  summary: Radiation-induced volumetric expansion (RIVE) of aggregate minerals and hydrogen transport in irradiated hydrates.
  image: ""
  figure_hint: Amorphized quartz cell or RIVE vs. dose curve
  body: >-
    Concrete near nuclear reactors is exposed to neutron and gamma radiation. Using molecular dynamics,
    we quantify radiation-induced volumetric expansion in the minerals of concrete aggregates (quartz,
    feldspars, micas, inosilicates) and study H₂ transport in irradiated hydrates. These results feed
    mesoscale simulations and simplified models of irradiated concrete.
  people: [Hazem Ferchichi, Abderrahmane Lahmar, Stéphane Poyet, Benoît Bary, Paul Fossati, Sophie Le Caër]
  funding: [CEA]
  papers: [J52, J69]

- id: clay-diffusion
  title: Water and ions in clays
  scale: "Å → nm"
  summary: Anomalous diffusion, swelling and thermo-poromechanics of water and counterions confined in swelling clays.
  image: ""
  figure_hint: Montmorillonite interlayer with water and counterions, or MSD curves
  body: >-
    Swelling clays confine water and ions in nanometric interlayers. We show that their transport is
    subdiffusive and describe it with fractional diffusion laws, and we study how counterions control
    disjoining and swelling pressure. The same framework explains anomalous thermal pressurization and
    heat capacity in clays.
  people: [Laurent Brochard, Matthieu Vandamme]
  funding: []
  papers: [J67, J37, J27, J13, J8, J7]

- id: electrical
  title: Electrical and dielectric properties
  scale: "Å → m"
  summary: Dielectric permittivity and ionic conductivity of pore solutions and hydrates, upscaled for non-destructive testing.
  image: ""
  figure_hint: Dielectric spectrum or impedance plot of C-S-H
  body: >-
    Electrical and dielectric measurements are non-destructive ways to follow hydration, moisture and
    degradation in concrete. We compute the dielectric permittivity and ionic conductivity of pore solutions
    and hydrates from molecular simulations, and upscale them with micromechanics to interpret impedance and
    microwave measurements on cement pastes and concrete.
  people: [Sofiane Ait-Hamadouche, Walter Batista Bonfim, Oswaldo Cascudo, Helena Carasek, Éric Vourc'h, Thierry Bore]
  funding: [IDEX LaSIPS (HYDRA)]
  papers: [J60, J45, J43, J19, J18, J17]

- id: low-carbon
  title: Low-carbon concrete
  scale: "nm → m"
  summary: Composition–property links for low-clinker binders, combining thermodynamic modeling, micromechanics and data.
  image: ""
  figure_hint: Phase assemblage or property map of a blended binder
  body: >-
    Reducing the clinker content of concrete changes its hydrates, microstructure and durability.
    We connect binder composition to properties using thermodynamic modeling, micromechanics and
    machine learning, and study new hydrates such as M-(A)-S-H and the electrical response of C-S-H
    for non-destructive monitoring of low-carbon cement systems.
  people: [Fatima Masara, Nathan Martins, Walter Batista Bonfim, Oswaldo Cascudo, Thibault Charpentier]
  funding: []
  papers: [J60, J61, J41]
