bio: >-
  I develop multiscale, multiphysics models that connect the molecular structure of
  cement hydrates and clays to the durability and mechanics of concrete. My work combines
  molecular simulation, thermodynamic modeling, micromechanics and experiments, with a
  focus on confined water, alkali–silica reaction, irradiation effects and low-carbon binders.
bio_extra: >-
  I chair the RILEM Technical Committee ASM on atomistic simulations for cement-based
  materials. HDR, Université Paris-Saclay (2023). Previously Associate Professor at
  ENS Paris-Saclay (2018–2023).

